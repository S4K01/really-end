    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    height: 100%; height: 100dvh; width: 100%;
    background: var(--void); overflow: hidden;
    font-family: 'JetBrains Mono', monospace;
    user-select: none; -webkit-user-select: none; cursor: default;

    position: fixed; inset: 0; background: #050505; color: #fff;

    cursor: pointer; box-shadow: 0 4px 15px rgba(255,255,255,0.2);
    margin-top: 20px; transition: transform 0.1s;

  #start-btn:active { transform: scale(0.95); }

  #camera-black {
    position: fixed; inset: 0; background: #000000; z-index: 200; display: none;
  }

  #camera-flash {
    position: fixed; inset: 0; background: #ffffff; z-index: 201;
    opacity: 0; pointer-events: none;
  }

  .flash-bang { animation: flashAnim 0.15s ease-out forwards; }
  @keyframes flashAnim {
    0% { opacity: 1; } 20% { opacity: 1; } 100% { opacity: 0; }
  }

  #noise {
    position: fixed; inset: 0; z-index: 1; opacity: 0.07; pointer-events: none;

    padding: 4vh 5vw; color: var(--danger); display: flex; flex-direction: column; overflow: hidden;
  }

  #vignette {

    display: inline-block; width: 6px; height: 6px; border-radius: 50%;
    background: var(--danger); margin-right: 6px;

  @keyframes pulse { 0% { opacity: 1; transform: scale(1); } 50% { opacity: 0.3; transform: scale(0.8); } 100% { opacity: 1; transform: scale(1); } }

    white-space: pre-wrap; word-wrap: break-word; 
    font-size: clamp(12px, 3.5vw, 16px); line-height: 1.6;
    text-shadow: 0 0 5px rgba(255,0,60,0.6); overflow-y: auto; overflow-x: hidden;
    max-height: 85vh; padding-right: 5px; flex-grow: 1;
  }

  #log::-webkit-scrollbar-thumb { background: var(--danger-dim); }

  .danger { color: var(--danger); text-shadow: 0 0 8px rgba(255,0,60,0.8); }
  .cold { color: var(--cold); text-shadow: 0 0 8px rgba(0,212,255,0.6); }
  .ghost { color: var(--ghost-bright); text-shadow: none; }
  .dim { color: var(--ghost); }
  .bright { color: var(--white); text-shadow: 0 0 10px rgba(255,255,255,0.7); }
  .amber { color: var(--amber); text-shadow: 0 0 6px rgba(255,157,0,0.6); }

  .panelbox {
    border: 1px solid var(--danger); background: rgba(255,0,60,0.04);
    padding: 12px; margin: 12px 0; border-left: 3px solid var(--danger);
    font-size: clamp(11px, 2.5vw, 14px); line-height: 1.7;
  }

  .ascii-art {
    font-family: monospace; font-size: clamp(9px, 1.8vw, 11px); 
    line-height: 1.1; white-space: pre; color: var(--danger);
    margin: 15px 0; text-align: center;
    text-shadow: 0 0 12px rgba(255,0,60,0.9);
  }

  .symbol-container {
    display: flex; justify-content: center; align-items: center;
    margin: 20px 0; width: 100%;

    width: clamp(160px, 35vw, 240px); height: auto;
    filter: drop-shadow(0 0 15px rgba(255, 0, 60, 0.9));
    animation: pulseSymbol 0.8s infinite alternate ease-in-out;

    0% { transform: scale(0.96); filter: drop-shadow(0 0 10px rgba(255,0,60,0.8)); }

  @keyframes shakeanim {

    opacity: 0; pointer-events: none; mix-blend-mode: hard-light;
    filter: contrast(1.5) grayscale(1) invert(1) sepia(1) hue-rotate(300deg);
  }
</style>

  class AudioEngine {
    constructor() {

      this.ctx = new AudioContext();

      const clickOsc = this.ctx.createOscillator();
      const clickGain = this.ctx.createGain();
      clickOsc.type = 'square';

      clickGain.gain.setValueAtTime(0.9, t);
      clickGain.gain.exponentialRampToValueAtTime(0.01, t + 0.08);
      clickOsc.connect(clickGain).connect(this.ctx.destination);
      clickOsc.start(t); clickOsc.stop(t + 0.08);

      const noiseSrc = this.ctx.createBufferSource();
      noiseSrc.buffer = this.noiseBuffer;
      const noiseFilter = this.ctx.createBiquadFilter();
      noiseFilter.type = 'highpass';
      noiseFilter.frequency.value = 1200;
      const noiseGain = this.ctx.createGain();
      noiseGain.gain.setValueAtTime(0.85, t);
      noiseGain.gain.exponentialRampToValueAtTime(0.01, t + 0.15);
      noiseSrc.connect(noiseFilter).connect(noiseGain).connect(this.ctx.destination);
      noiseSrc.start(t); noiseSrc.stop(t + 0.15);

      const whineOsc = this.ctx.createOscillator();
      const whineGain = this.ctx.createGain();
      whineOsc.type = 'sine';
      whineOsc.frequency.setValueAtTime(2800, t);
      whineOsc.frequency.linearRampToValueAtTime(3800, t + 0.08);
      whineGain.gain.setValueAtTime(0, t);
      whineGain.gain.linearRampToValueAtTime(0.2, t + 0.04);
      whineGain.gain.exponentialRampToValueAtTime(0.001, t + 2.0);
      whineOsc.connect(whineGain).connect(this.ctx.destination);
      whineOsc.start(t); whineOsc.stop(t + 2.0);
    }

    playTypingSound() {
      const t = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'square';
      osc.frequency.value = 550 + Math.random() * 350;
      gain.gain.setValueAtTime(0.015, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.03);
      osc.connect(gain).connect(this.ctx.destination);
      osc.start(t); osc.stop(t + 0.03);
    }

    playGlitch() {
      const t = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(100 + Math.random()*500, t);
      gain.gain.setValueAtTime(0.1, t);
      gain.gain.exponentialRampToValueAtTime(0.01, t + 0.1);
      osc.connect(gain).connect(this.ctx.destination);
      osc.start(t); osc.stop(t + 0.1);
    }

    playCinematicBoom() {
      const t = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(90, t);
      osc.frequency.exponentialRampToValueAtTime(18, t + 2.2);
      gain.gain.setValueAtTime(0.95, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 2.2);
      osc.connect(gain).connect(this.ctx.destination);
      osc.start(t); osc.stop(t + 2.2);

    playThump(time, pitch, duration, vol) {
      const osc = this.ctx.createOscillator();
      const filter = this.ctx.createBiquadFilter();
      const gain = this.ctx.createGain();

      osc.frequency.exponentialRampToValueAtTime(pitch * 0.1, time + duration);
      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(250, time);
      filter.frequency.exponentialRampToValueAtTime(40, time + duration);
      gain.gain.setValueAtTime(0, time);
      gain.gain.linearRampToValueAtTime(vol, time + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, time + duration);
      osc.start(time); osc.stop(time + duration);
    }

    scheduler() {
      while (this.nextNoteTime < this.ctx.currentTime + 0.1) {
        this.playThump(this.nextNoteTime, 120, 0.15, 0.9);
        this.playThump(this.nextNoteTime + 0.2, 100, 0.20, 0.7);
        this.nextNoteTime += (60.0 / this.bpm);
      }
      if (this.isPlayingHeartbeat) {
        this.timerID = requestAnimationFrame(this.scheduler.bind(this));
      }
    }

    startHeartbeat() {
      if (this.ctx.state === 'suspended') this.ctx.resume();
      this.isPlayingHeartbeat = true;
      this.nextNoteTime = this.ctx.currentTime + 0.1;
      this.scheduler();
    }

    stopHeartbeat() {
      this.isPlayingHeartbeat = false;
      cancelAnimationFrame(this.timerID);
    }

    setBPM(newBPM) { this.bpm = newBPM; }
  }
